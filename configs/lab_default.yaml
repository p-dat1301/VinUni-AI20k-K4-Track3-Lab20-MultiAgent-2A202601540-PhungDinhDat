lab:
  name: multi-agent-research-lab
  max_iterations: 6
  timeout_seconds: 60

agents:
  supervisor:
    model: gpt-4o-mini
    temperature: 0.0
  researcher:
    model: gpt-4o-mini
    temperature: 0.2
  analyst:
    model: gpt-4o-mini
    temperature: 0.1
  writer:
    model: gpt-4o-mini
    temperature: 0.4

benchmark:
  queries:
    - "Compare single-agent and multi-agent architectures for complex research tasks"
    - "Summarize production guardrails and failure modes for LLM agents"
    - "Explain role specialization and shared state in multi-agent systems"
